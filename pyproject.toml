[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon-v2-synthetic-demo"
version = "0.1.0.dev0"
description = "A small GA4GH Beacon v2 node that serves synthetic genomes, written with the Python standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Ruslan Plakhuta" }]
keywords = ["genomics", "beacon", "ga4gh", "synthetic data", "data discovery", "vcf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.scripts]
beacon-demo = "beacon_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beacon_demo = ["positions.tsv"]
