name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Python 3.9 has no build for the newest Ubuntu runner image, so it runs on Ubuntu 24.04.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: PYTHONPATH=src:tests python -m unittest discover -s tests -v
      - name: Command line
        run: |
          PYTHONPATH=src python -m beacon_demo synth out/
          PYTHONPATH=src python -m beacon_demo query --data out/ "/g_variants?referenceName=10&start=94781858&referenceBases=G&alternateBases=A"

  schemas:
    # Validates every kind of response, and the records in them, against the Beacon v2.2.0 JSON schemas.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the Beacon v2.2.0 schemas
        run: |
          git clone --quiet --depth 1 --branch v2.2.0 https://github.com/ga4gh-beacon/beacon-v2 "$RUNNER_TEMP/beacon-v2"
          test "$(git -C "$RUNNER_TEMP/beacon-v2" rev-parse HEAD)" = c6558bf2e6494df3905f7b2df66e903dfe509500
      - name: Validate the responses
        run: |
          python -m pip install --disable-pip-version-check "jsonschema==4.26.0"
          python tools/validate_schemas.py --schemas "$RUNNER_TEMP/beacon-v2"
